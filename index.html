<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meca-Casa - Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for the table */
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

<div class="max-w-[95%] mx-auto bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    
    <!-- Header -->
    <div class="bg-[#1a5c37] px-6 py-5 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Meca-Casa</h1>
            <p class="text-sm text-green-100 mt-1">Disponibilité du Stock</p>
        </div>
        <div class="text-right text-xs text-green-100">
            <div>Dernière mise à jour:</div>
            <div id="last-updated" class="font-mono font-medium">Chargement...</div>
        </div>
    </div>

    <!-- Filters Area -->
    <div class="p-4 bg-slate-50 border-b border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- Search -->
            <div class="col-span-1 md:col-span-2 lg:col-span-1">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Recherche</label>
                <input type="text" id="search" placeholder="SAP, Article, Desc..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a5c37] text-sm">
            </div>

            <!-- Category -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Catégorie</label>
                <select id="filter-category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Toutes les catégories</option>
                </select>
            </div>

            <!-- Status -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Statut</label>
                <select id="filter-status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Tous les statuts</option>
                    <option value="inStock">En Stock</option>
                    <option value="lowStock">Stock Faible</option>
                    <option value="outOfStock">Rupture</option>
                </select>
            </div>

            <!-- Position -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Position</label>
                <select id="filter-position" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Toutes les positions</option>
                </select>
            </div>

            <!-- Date Range -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Date de commande</label>
                <select id="filter-date" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="all">Tout le temps</option>
                    <option value="7d">7 derniers jours</option>
                    <option value="30d">30 derniers jours</option>
                    <option value="90d">90 derniers jours</option>
                    <option value="6m">6 derniers mois</option>
                    <option value="1y">Dernière année</option>
                    <option value="older">Plus d'un an</option>
                </select>
            </div>

            <!-- Has Reservation -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">A une réservation</label>
                <select id="filter-reservation" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="any">Tous</option>
                    <option value="yes">Oui</option>
                    <option value="no">Non</option>
                </select>
            </div>

            <!-- Reset Button -->
            <div class="flex items-end">
                <button id="btn-reset" class="w-full px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-sm transition-colors">
                    Réinitialiser les filtres
                </button>
            </div>
        </div>
    </div>

    <!-- Table Area -->
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-slate-100 text-slate-600 border-b border-slate-200">
                <tr>
                    <th class="px-4 py-3 font-semibold">SAP</th>
                    <th class="px-4 py-3 font-semibold">Article</th>
                    <th class="px-4 py-3 font-semibold">Description</th>
                    <th class="px-4 py-3 font-semibold">Catégorie</th>
                    <th class="px-4 py-3 font-semibold text-center bg-blue-50">Qté</th>
                    <th class="px-4 py-3 font-semibold text-center">Vendu</th>
                    <th class="px-4 py-3 font-semibold text-center">Réservé</th>
                    <th class="px-4 py-3 font-semibold text-center bg-green-50">Disponible</th>
                    <th class="px-4 py-3 font-semibold text-center">Statut</th>
                    <th class="px-4 py-3 font-semibold text-right">Prix Init (€)</th>
                    <th class="px-4 py-3 font-semibold text-right">Prix Net (€)</th>
                    <th class="px-4 py-3 font-semibold text-center">Taux</th>
                    <th class="px-4 py-3 font-semibold">Position</th>
                </tr>
            </thead>
            <tbody id="stock-body" class="divide-y divide-slate-100">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden p-12 text-center text-slate-500">
        Aucun produit ne correspond à vos filtres.
    </div>

</div>

<script>
    let allStockData = [];
    let filters = {
        search: '', category: '', status: '', position: '', date: 'all', reservation: 'any'
    };

    async function fetchStock() {
        try {
            const response = await fetch('stock.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Data not ready');
            
            const data = await response.json();
            allStockData = data.products || [];
            
            // Update last updated text
            document.getElementById('last-updated').innerText = new Date(data.updatedAt).toLocaleString('fr-FR');
            
            // Populate Dropdowns dynamically
            populateDropdown('filter-category', [...new Set(allStockData.map(i => i.category).filter(Boolean))]);
            populateDropdown('filter-position', [...new Set(allStockData.map(i => i.position).filter(Boolean))]);
            
            applyFilters();
        } catch (error) {
            document.getElementById('stock-body').innerHTML = `<tr><td colspan="13" class="text-center py-8 text-red-500">Erreur: Impossible de charger les données.</td></tr>`;
        }
    }

    function populateDropdown(id, values) {
        const select = document.getElementById(id);
        const currentVal = select.value;
        // Keep the first default option
        select.innerHTML = select.options[0].outerHTML;
        values.sort().forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
        });
        select.value = currentVal; // Restore selection if it existed
    }

    function applyFilters() {
        const now = new Date().getTime();
        const dayMs = 24 * 60 * 60 * 1000;

        const filtered = allStockData.filter(item => {
            // 1. Search
            const term = filters.search.toLowerCase();
            const matchSearch = !term || 
                item.sap.toLowerCase().includes(term) || 
                item.article.toLowerCase().includes(term) || 
                (item.description && item.description.toLowerCase().includes(term));
            
            // 2. Category
            const matchCategory = !filters.category || item.category === filters.category;
            
            // 3. Status
            const matchStatus = !filters.status || item.status === filters.status;
            
            // 4. Position
            const matchPosition = !filters.position || item.position === filters.position;
            
            // 5. Reservation
            let matchReservation = true;
            if (filters.reservation === 'yes') matchReservation = item.hasReservation === true;
            if (filters.reservation === 'no') matchReservation = item.hasReservation === false;

            // 6. Date
            let matchDate = true;
            if (filters.date !== 'all' && item.orderDate) {
                const age = now - new Date(item.orderDate).getTime();
                if (filters.date === '7d') matchDate = age <= 7 * dayMs;
                if (filters.date === '30d') matchDate = age <= 30 * dayMs;
                if (filters.date === '90d') matchDate = age <= 90 * dayMs;
                if (filters.date === '6m') matchDate = age <= 180 * dayMs;
                if (filters.date === '1y') matchDate = age <= 365 * dayMs;
                if (filters.date === 'older') matchDate = age > 365 * dayMs;
            } else if (filters.date !== 'all' && !item.orderDate) {
                matchDate = false;
            }

            return matchSearch && matchCategory && matchStatus && matchPosition && matchReservation && matchDate;
        });

        renderTable(filtered);
    }

    function renderTable(data) {
        const tbody = document.getElementById('stock-body');
        const empty = document.getElementById('empty-state');
        
        if (data.length === 0) {
            tbody.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        tbody.innerHTML = data.map(item => {
            let statusBadge = '';
            if (item.status === 'inStock') {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700 border border-green-200">En Stock</span>`;
            } else if (item.status === 'lowStock') {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700 border border-yellow-200">Stock Faible</span>`;
            } else {
                statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700 border border-red-200">Rupture</span>`;
            }

            const fmt = (n) => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            return `
            <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-4 py-3 font-medium text-slate-700">${item.sap}</td>
                <td class="px-4 py-3 font-medium">${item.article}</td>
                <td class="px-4 py-3 text-slate-500 max-w-[200px] truncate" title="${item.description}">${item.description || '-'}</td>
                <td class="px-4 py-3">
                    ${item.category ? `<span class="px-2 py-0.5 bg-slate-100 text-slate-600 text-xs rounded border border-slate-200">${item.category}</span>` : '-'}
                </td>
                <td class="px-4 py-3 text-center font-semibold bg-blue-50/50">${item.totalQuantity}</td>
                <td class="px-4 py-3 text-center text-slate-500">${item.soldQuantity || '-'}</td>
                <td class="px-4 py-3 text-center text-orange-500">${item.reservedQuantity || '-'}</td>
                <td class="px-4 py-3 text-center font-bold text-green-700 bg-green-50/50">${item.availableQuantity}</td>
                <td class="px-4 py-3 text-center">${statusBadge}</td>
                <td class="px-4 py-3 text-right text-red-600 font-medium">€${fmt(item.initialPriceEuro)}</td>
                <td class="px-4 py-3 text-right text-slate-700">€${fmt(item.netPriceEuro)}</td>
                <td class="px-4 py-3 text-center text-blue-600 font-medium">${item.rate}</td>
                <td class="px-4 py-3 text-slate-500">${item.position || '-'}</td>
            </tr>`;
        }).join('');
    }

    // Event Listeners for Filters
    document.getElementById('search').addEventListener('input', (e) => { filters.search = e.target.value; applyFilters(); });
    document.getElementById('filter-category').addEventListener('change', (e) => { filters.category = e.target.value; applyFilters(); });
    document.getElementById('filter-status').addEventListener('change', (e) => { filters.status = e.target.value; applyFilters(); });
    document.getElementById('filter-position').addEventListener('change', (e) => { filters.position = e.target.value; applyFilters(); });
    document.getElementById('filter-date').addEventListener('change', (e) => { filters.date = e.target.value; applyFilters(); });
    document.getElementById('filter-reservation').addEventListener('change', (e) => { filters.reservation = e.target.value; applyFilters(); });

    document.getElementById('btn-reset').addEventListener('click', () => {
        document.getElementById('search').value = '';
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-status').value = '';
        document.getElementById('filter-position').value = '';
        document.getElementById('filter-date').value = 'all';
        document.getElementById('filter-reservation').value = 'any';
        filters = { search: '', category: '', status: '', position: '', date: 'all', reservation: 'any' };
        applyFilters();
    });

    // Initial load and polling
    fetchStock();
    setInterval(fetchStock, 60000); // Refresh data every 60s
</script>

</body>
</html>
