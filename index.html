<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meca-Casa - Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .overflow-x-auto::-webkit-scrollbar { height: 8px; }
        .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .overflow-x-auto::-webkit-scrollbar-track { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8">

<div class="max-w-[95%] mx-auto bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
    
    <!-- Header -->
    <div class="bg-[#1a5c37] px-4 py-4 md:px-6 md:py-5 text-white flex flex-col md:flex-row justify-between items-start md:items-center gap-2">
        <div>
            <h1 class="text-2xl font-bold tracking-tight">Meca-Casa</h1>
            <p class="text-sm text-green-100 mt-1">Disponibilité du Stock</p>
        </div>
        <div class="text-left md:text-right text-xs text-green-100">
            <div>Dernière mise à jour:</div>
            <div id="last-updated" class="font-mono font-medium">Chargement...</div>
        </div>
    </div>

    <!-- Filters Area -->
    <div class="p-4 bg-slate-50 border-b border-slate-200">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- Search -->
            <div class="col-span-1 sm:col-span-2 lg:col-span-1">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Recherche</label>
                <input type="text" id="search" placeholder="SAP, Article, Desc..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1a5c37] text-sm">
            </div>

            <!-- Category -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Catégorie</label>
                <select id="filter-category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Toutes les catégories</option>
                </select>
            </div>

            <!-- Status -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Statut</label>
                <select id="filter-status" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Tous les statuts</option>
                    <option value="inStock">En Stock</option>
                    <option value="lowStock">Stock Faible</option>
                    <option value="outOfStock">Rupture</option>
                </select>
            </div>

            <!-- Position -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Position</label>
                <select id="filter-position" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#1a5c37]">
                    <option value="">Toutes les positions</option>
                </select>
            </div>

            <!-- Reset Button -->
            <div class="flex items-end sm:col-span-2 lg:col-span-4">
                <button id="btn-reset" class="w-full md:w-auto px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-sm transition-colors">
                    Réinitialiser les filtres
                </button>
            </div>
        </div>
    </div>

    <!-- DESKTOP TABLE VIEW (Hidden on Mobile) -->
    <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-slate-100 text-slate-600 border-b border-slate-200">
                <tr>
                    <th class="px-4 py-3 font-semibold">SAP</th>
                    <th class="px-4 py-3 font-semibold">Article</th>
                    <th class="px-4 py-3 font-semibold">Description</th>
                    <th class="px-4 py-3 font-semibold">Catégorie</th>
                    <th class="px-4 py-3 font-semibold text-center bg-green-50">Disponible</th>
                    <th class="px-4 py-3 font-semibold text-center">Statut</th>
                    <th class="px-4 py-3 font-semibold text-right">Prix Net (€)</th>
                </tr>
            </thead>
            <tbody id="stock-body-desktop" class="divide-y divide-slate-100">
                <!-- Rows injected by JS -->
            </tbody>
        </table>
    </div>

    <!-- MOBILE CARD VIEW (Hidden on Desktop) -->
    <div id="stock-body-mobile" class="md:hidden divide-y divide-slate-100">
        <!-- Cards injected by JS -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden p-12 text-center text-slate-500">
        Aucun produit ne correspond à vos filtres.
    </div>

</div>

<script>
    let allStockData = [];
    let filters = { search: '', category: '', status: '', position: '' };

    async function fetchStock() {
        try {
            const response = await fetch('stock.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Data not ready');
            
            const data = await response.json();
            allStockData = data.products || [];
            
            document.getElementById('last-updated').innerText = new Date(data.updatedAt).toLocaleString('fr-FR');
            
            populateDropdown('filter-category', [...new Set(allStockData.map(i => i.category).filter(Boolean))]);
            populateDropdown('filter-position', [...new Set(allStockData.map(i => i.position).filter(Boolean))]);
            
            applyFilters();
        } catch (error) {
            document.getElementById('stock-body-desktop').innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500">Erreur de chargement.</td></tr>`;
            document.getElementById('stock-body-mobile').innerHTML = `<div class="p-4 text-center text-red-500 text-sm">Erreur de chargement.</div>`;
        }
    }

    function populateDropdown(id, values) {
        const select = document.getElementById(id);
        const currentVal = select.value;
        select.innerHTML = select.options[0].outerHTML;
        values.sort().forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            select.appendChild(opt);
        });
        select.value = currentVal;
    }

    function applyFilters() {
        const filtered = allStockData.filter(item => {
            const term = filters.search.toLowerCase();
            const matchSearch = !term || 
                item.sap.toLowerCase().includes(term) || 
                item.article.toLowerCase().includes(term) || 
                (item.description && item.description.toLowerCase().includes(term));
            
            const matchCategory = !filters.category || item.category === filters.category;
            const matchStatus = !filters.status || item.status === filters.status;
            const matchPosition = !filters.position || item.position === filters.position;

            return matchSearch && matchCategory && matchStatus && matchPosition;
        });

        renderViews(filtered);
    }

    function getStatusBadge(status) {
        if (status === 'inStock') return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700">En Stock</span>`;
        if (status === 'lowStock') return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-700">Stock Faible</span>`;
        return `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700">Rupture</span>`;
    }

    function renderViews(data) {
        const tbodyDesktop = document.getElementById('stock-body-desktop');
        const tbodyMobile = document.getElementById('stock-body-mobile');
        const empty = document.getElementById('empty-state');
        
        if (data.length === 0) {
            tbodyDesktop.innerHTML = '';
            tbodyMobile.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');

        const fmt = (n) => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        // 1. Render Desktop Table
        tbodyDesktop.innerHTML = data.map(item => `
            <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-4 py-3 font-medium text-slate-700">${item.sap}</td>
                <td class="px-4 py-3 font-medium">${item.article}</td>
                <td class="px-4 py-3 text-slate-500 max-w-[200px] truncate">${item.description || '-'}</td>
                <td class="px-4 py-3">${item.category || '-'}</td>
                <td class="px-4 py-3 text-center font-bold text-green-700 bg-green-50/50">${item.availableQuantity}</td>
                <td class="px-4 py-3 text-center">${getStatusBadge(item.status)}</td>
                <td class="px-4 py-3 text-right text-slate-700">€${fmt(item.netPriceEuro)}</td>
            </tr>
        `).join('');

        // 2. Render Mobile Cards
        tbodyMobile.innerHTML = data.map(item => `
            <div class="p-4 bg-white hover:bg-slate-50 transition-colors flex flex-col gap-2">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="font-bold text-slate-800 text-base">${item.article}</div>
                        <div class="text-xs text-slate-500 font-mono">SAP: ${item.sap}</div>
                    </div>
                    ${getStatusBadge(item.status)}
                </div>
                
                <div class="text-sm text-slate-600 line-clamp-2">${item.description || 'Pas de description'}</div>
                
                <div class="flex justify-between items-end mt-2 pt-2 border-t border-slate-100">
                    <div>
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Disponible</div>
                        <div class="text-xl font-bold text-green-700">${item.availableQuantity}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Prix Net</div>
                        <div class="font-medium text-slate-700">€${fmt(item.netPriceEuro)}</div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Event Listeners
    document.getElementById('search').addEventListener('input', (e) => { filters.search = e.target.value; applyFilters(); });
    document.getElementById('filter-category').addEventListener('change', (e) => { filters.category = e.target.value; applyFilters(); });
    document.getElementById('filter-status').addEventListener('change', (e) => { filters.status = e.target.value; applyFilters(); });
    document.getElementById('filter-position').addEventListener('change', (e) => { filters.position = e.target.value; applyFilters(); });

    document.getElementById('btn-reset').addEventListener('click', () => {
        document.getElementById('search').value = '';
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-status').value = '';
        document.getElementById('filter-position').value = '';
        filters = { search: '', category: '', status: '', position: '' };
        applyFilters();
    });

    fetchStock();
    setInterval(fetchStock, 60000);
</script>

</body>
</html>
