<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meca-Casa - Disponibilité du Stock</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a5c37; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #777; margin-top: 0; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a5c37; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .in-stock { color: #2e7d32; font-weight: bold; }
        .out-stock { color: #c62828; font-weight: bold; }
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meca-Casa</h1>
    <p class="subtitle">Disponibilité du Stock en Temps Réel</p>
    
    <input type="text" id="search" placeholder="Rechercher par SAP, Article ou Description...">
    
    <table id="stock-table">
        <thead>
            <tr>
                <th>SAP</th>
                <th>Article</th>
                <th>Description</th>
                <th>Disponibilité</th>
                <th>Prix (DA)</th>
            </tr>
        </thead>
        <tbody id="stock-body">
            <tr><td colspan="5" style="text-align:center;">Chargement des données...</td></tr>
        </tbody>
    </table>
    
    <div class="footer" id="last-updated">Dernière mise à jour: -</div>
</div>

<script>
    let stockData = [];

    async function fetchStock() {
        try {
            // Fetch the JSON file generated by the bridge script
            const response = await fetch('stock.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('Data not ready');
            
            const data = await response.json();
            stockData = data.products;
            
            document.getElementById('last-updated').innerText = 'Dernière mise à jour: ' + new Date(data.updatedAt).toLocaleString('fr-FR');
            renderTable(stockData);
        } catch (error) {
            document.getElementById('stock-body').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Erreur: Impossible de charger le stock.</td></tr>`;
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('stock-body');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Aucun produit trouvé.</td></tr>';
            return;
        }
        
        tbody.innerHTML = data.map(item => `
            <tr>
                <td>${item.sap}</td>
                <td>${item.article}</td>
                <td>${item.description}</td>
                <td class="${item.available > 0 ? 'in-stock' : 'out-stock'}">
                    ${item.available > 0 ? item.available + ' en stock' : 'Rupture'}
                </td>
                <td>${item.price > 0 ? item.price.toLocaleString() + ' DA' : '-'}</td>
            </tr>
        `).join('');
    }

    document.getElementById('search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = stockData.filter(item => 
            item.sap.toLowerCase().includes(term) || 
            item.article.toLowerCase().includes(term) || 
            item.description.toLowerCase().includes(term)
        );
        renderTable(filtered);
    });

    // Load immediately, then every 60 seconds
    fetchStock();
    setInterval(fetchStock, 60000);
</script>

</body>
</html>
